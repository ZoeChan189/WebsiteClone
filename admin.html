<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Portal - storetainguyen</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <aside class="admin-sidebar">
        <a class="admin-brand" href="admin.html">
            <span>storetainguyen</span>
            <small>Admin portal</small>
        </a>
        <button class="admin-nav active" data-view="products">Sản phẩm</button>
        <button class="admin-nav" data-view="categories">Danh mục</button>
        <button class="admin-nav" data-view="orders">Đơn hàng</button>
        <a class="admin-home" href="index.html">Về website</a>
    </aside>

    <main class="admin-main">
        <header class="admin-header">
            <div>
                <p class="eyebrow">Local backend</p>
                <h1>Quan tri storetainguyen</h1>
            </div>
            <form id="loginForm" class="token-form">
                <input id="adminUsername" autocomplete="username" placeholder="Tài khoản">
                <input id="adminPassword" type="password" autocomplete="current-password" placeholder="Mật khẩu">
                <button type="submit">Đăng nhập</button>
            </form>
        </header>

        <section class="stats-grid" id="statsGrid">
            <article><span>Sản phẩm</span><strong id="statProducts">0</strong></article>
            <article><span>Danh mục</span><strong id="statCategories">0</strong></article>
            <article><span>Đơn hàng</span><strong id="statOrders">0</strong></article>
            <article><span>Doanh thu</span><strong id="statRevenue">0đ</strong></article>
        </section>

        <section class="admin-panel active" id="productsPanel">
            <div class="panel-head">
                <h2>Sản phẩm</h2>
                <div class="panel-tools"><input id="productSearch" placeholder="Tim san pham, slug, danh muc"><button id="newProductButton">Them san pham</button></div>
            </div>
            <form id="productForm" class="editor-form hidden">
                <input type="hidden" id="productId">
                <label>Tên sản phẩm<input id="productName" required></label>
                <label>Slug<input id="productSlug"></label>
                <label>Danh mục<select id="productCategory"></select></label>
                <label>Anh san pham<input id="productImage" placeholder="https://.../anh-san-pham.webp"></label><label>Icon san pham<input id="productIcon" placeholder="https://.../icon.webp"></label><label>Giam gia<input id="productDiscount" placeholder="-75%"></label>
                <label>Giá<input id="productPrice" type="number" min="0"></label>
                <label>Giá cũ<input id="productOldPrice" type="number" min="0"></label>
                <label>Tồn kho<input id="productStock" type="number" min="0"></label>
                <label>Đánh giá<input id="productRating" type="number" min="0" max="5" step="0.1"></label>
                <label>Đã bán<input id="productSold" type="number" min="0"></label>
                <label>Trạng thái<select id="productStatus"><option value="active">active</option><option value="draft">draft</option></select></label>
                <label class="full">Mo ta<textarea id="productDescription" rows="3"></textarea></label><div class="product-preview full"><span>Preview</span><img id="productImagePreview" alt=""><img id="productIconPreview" alt=""></div>
                <div class="form-actions">
                    <button type="submit">Lưu sản phẩm</button>
                    <button type="button" id="cancelProductButton">Hủy</button>
                </div>
            </form>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Sản phẩm</th><th>Danh mục</th><th>Giá</th><th>Kho</th><th>TT</th><th></th></tr></thead>
                    <tbody id="productsTable"></tbody>
                </table>
            </div>
        </section>

        <section class="admin-panel" id="categoriesPanel">
            <div class="panel-head">
                <h2>Danh mục</h2>
                <button id="newCategoryButton">Thêm danh mục</button>
            </div>
            <form id="categoryForm" class="editor-form hidden">
                <input type="hidden" id="categoryId">
                <label>Tên danh mục<input id="categoryName" required></label>
                <label>Slug<input id="categorySlug"></label>
                <label>Trạng thái<select id="categoryStatus"><option value="active">active</option><option value="draft">draft</option></select></label>
                <label class="full">Mô tả<textarea id="categoryDescription" rows="3"></textarea></label>
                <div class="form-actions">
                    <button type="submit">Lưu danh mục</button>
                    <button type="button" id="cancelCategoryButton">Hủy</button>
                </div>
            </form>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Danh mục</th><th>Slug</th><th>TT</th><th></th></tr></thead>
                    <tbody id="categoriesTable"></tbody>
                </table>
            </div>
        </section>

        <section class="admin-panel" id="ordersPanel">
            <div class="panel-head">
                <h2>Đơn hàng</h2>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Khách</th><th>Sản phẩm</th><th>Tổng</th><th>Trạng thái</th><th>Ngày</th></tr></thead>
                    <tbody id="ordersTable"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div class="toast" id="toast"></div>
    <script src="js/admin.js"></script>
</body>
</html>
